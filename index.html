<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ObraLab</title>
<meta name="description" content="Herramientas, formatos y métodos de control de obra en mejora continua para ingenieros y arquitectos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Libreta de campo: cuadrícula de nivel tenue, columnas lista/detalle, amarillo maquinaria como único acento */
:root{
  color-scheme: light;
  --bg:#EDEFEC; --surface:#F8F9F7; --ink:#1A2124; --muted:#5B6662; --line:#CDD3CF; --grid:rgba(40,70,90,.06);
  --accent:#E3A21A; --accent-ink:#7A4E00; --on-accent:#1A1406;
  --ok:#2F7D4F; --warn:#B7791F; --bad:#B4382C;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131719; --surface:#1B2023; --ink:#E6EAE8; --muted:#9AA5A1; --line:#2E3639; --grid:rgba(160,200,220,.05);
  --accent:#F0B23A; --accent-ink:#F5C566; --on-accent:#1A1406;
  --ok:#5CBF85; --warn:#E3AE4F; --bad:#EE7565; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131719; --surface:#1B2023; --ink:#E6EAE8; --muted:#9AA5A1; --line:#2E3639; --grid:rgba(160,200,220,.05);
  --accent:#F0B23A; --accent-ink:#F5C566; --on-accent:#1A1406;
  --ok:#5CBF85; --warn:#E3AE4F; --bad:#EE7565; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{margin:0;font:800 26px/1 var(--display);font-stretch:118%;letter-spacing:-.01em}
.brand h1 b{color:var(--accent-ink);font-weight:800}
.brand small{font:500 12px var(--mono);color:var(--muted)}
.theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;font:500 12px var(--mono);cursor:pointer}
nav.tabs{display:flex;gap:4px;overflow-x:auto;width:100%;scrollbar-width:none}
nav.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 14px var(--body);font-stretch:105%;padding:8px 12px 7px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
nav.tabs .n{font:500 11px var(--mono);margin-left:6px;color:var(--muted)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main .wrap{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:24px;padding-block:24px 64px}
.list{display:flex;flex-direction:column;gap:8px;min-width:0}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:15px var(--body)}
.item{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.item:hover{border-color:var(--muted)}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.code{grid-row:span 2;font:600 11px var(--mono);color:var(--accent-ink);padding-top:3px;min-width:44px}
.item strong{font:700 15px/1.3 var(--display);font-stretch:105%}
.item span.r{color:var(--muted);font-size:13px;line-height:1.4}
.new{display:inline-block;margin-left:6px;font:600 10px var(--mono);background:var(--accent);color:var(--on-accent);border-radius:3px;padding:1px 5px;vertical-align:2px}
.empty{color:var(--muted);padding:16px 4px}
.grp{margin:10px 0 0;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

.detail{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px clamp(16px,3vw,32px);min-width:0;align-self:start}
.eyebrow{font:500 12px var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;display:flex;flex-wrap:wrap;gap:6px 14px}
.detail h2{font:800 clamp(24px,3.2vw,34px)/1.1 var(--display);font-stretch:112%;margin:8px 0 8px;text-wrap:balance}
.lead{color:var(--muted);max-width:62ch;margin:0 0 20px}
h3{font:700 13px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px}
.back{display:none;background:none;border:0;color:var(--accent-ink);font:600 14px var(--body);padding:0 0 12px;cursor:pointer}

.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.inp{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:6px;background:var(--bg);overflow:hidden}
.inp input{flex:1;min-width:0;border:0;background:none;color:var(--ink);padding:9px 10px;font:500 16px var(--mono);font-variant-numeric:tabular-nums}
.inp em{font:500 12px var(--mono);color:var(--muted);padding:0 10px;display:flex;align-items:center;border-left:1px solid var(--line);font-style:normal}
.outs{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.out{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.out span{color:var(--muted);font-size:14px}
.out b{font:600 17px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.out.big b{font-size:24px}
.out b small{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:1px}

ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;max-width:66ch}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
ol.steps li::before{content:counter(s,decimal-leading-zero);font:600 13px var(--mono);color:var(--accent-ink);padding-top:2px}
.benefit{border-left:3px solid var(--accent);padding:6px 0 6px 14px;margin:0 0 8px;max-width:62ch}

.hdr{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px}
.hdr textarea,.hdr input,.obs{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:8px 10px;font:14px var(--body)}
.hdr textarea{min-height:64px;resize:vertical}
.chk{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.chk .t{min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--bg);border:0;border-left:1px solid var(--line);color:var(--muted);font:600 12px var(--mono);padding:6px 9px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"].si{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"].no{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"].na{background:var(--muted);color:var(--surface)}
.chk .obs{grid-column:1/-1;padding:6px 8px;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--surface);border-radius:6px;padding:9px 14px;font:600 14px var(--body);cursor:pointer}
.btn.ghost{background:none;color:var(--ink)}
.tally{font:500 13px var(--mono);color:var(--muted);margin-top:8px}

.feed{display:flex;flex-direction:column;gap:0}
.upd{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.upd time{font:600 13px var(--mono);color:var(--accent-ink);padding-top:4px}
.upd h4{margin:0 0 6px;font:700 19px/1.25 var(--display);font-stretch:108%}
.upd p{margin:0 0 10px;max-width:64ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font:500 12px var(--body);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.apply{font-size:14px;color:var(--muted)}
.apply b{color:var(--ink)}
.src{font-size:12px;color:var(--muted);margin-top:8px}
.src a{color:var(--accent-ink)}
.kpis{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0 0 8px;font:500 13px var(--mono);color:var(--muted)}
.kpis b{display:block;font:700 26px var(--display);color:var(--ink)}
a{color:var(--accent-ink)}
footer{color:var(--muted);font-size:13px;padding-block:0 32px}

/* módulos: cuantificador de acero y escalera */
.mod{display:flex;flex-direction:column;gap:16px}
.ac{display:flex;flex-direction:column;gap:14px}
.ac-banner{margin:0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 6px 6px 0;font-size:14px}
.ac-addel{display:flex;flex-direction:column;gap:8px}
.ac-addel>div{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ac-addel .ac-mut{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;width:92px}
.ac-addel button,.ac-add button{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 10px;font:600 13px var(--body);cursor:pointer}
.ac-addel button:hover,.ac-add button:hover{border-color:var(--accent)}
.ac-crit{border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.ac-crit summary{cursor:pointer;font:600 14px var(--body)}
.ac-crit[open] summary{margin-bottom:10px}
.ac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px 10px}
.ac-f{display:flex;flex-direction:column;gap:3px;min-width:0}
.ac-f.w2{grid-column:span 2}
.ac-f span{font-size:12px;color:var(--muted);line-height:1.25}
.ac-f input,.ac-f select{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);padding:7px 8px;font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.ac-f select{font-family:var(--body)}
.ac-note{margin:0;font-size:13px;color:var(--muted);max-width:70ch}
.ac-list{display:flex;flex-direction:column;gap:10px}
.ac-el{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ac-el>summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px 14px;cursor:pointer;list-style:none}
.ac-el>summary::-webkit-details-marker{display:none}
.ac-el>summary::before{content:"▸";color:var(--muted);font-size:12px}
.ac-el[open]>summary::before{content:"▾"}
.ac-el[open]>summary{border-bottom:1px dashed var(--line)}
.ac-badge{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.04em;background:var(--ink);color:var(--surface);border-radius:3px;padding:2px 6px}
.ac-mut{color:var(--muted);font-size:13px}
.ac-kg{margin-left:auto;font:600 14px var(--mono);font-variant-numeric:tabular-nums}
.ac-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.ac-parr{display:flex;flex-wrap:wrap;align-items:center;gap:0}
.ac-parr span{font-size:13px;color:var(--muted);margin-right:10px}
.ac-parr button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:7px 14px;font:600 13px var(--body);cursor:pointer}
.ac-parr button:first-of-type{border-radius:6px 0 0 6px}
.ac-parr button:last-of-type{border-radius:0 6px 6px 0;border-left:0}
.ac-parr button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ac-rows{display:flex;flex-direction:column;gap:8px}
.ac-row{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--bg)}
.ac-row .ac-f input,.ac-row .ac-f select{background:var(--surface)}
.ac-rowh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ac-kind{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--accent-ink)}
.ac-estribo .ac-kind{color:var(--ok)}
.ac-x{background:none;border:0;color:var(--muted);font:500 12px var(--body);cursor:pointer;text-decoration:underline}
.ac-out{margin-top:8px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.ac-out b{color:var(--ink);font-family:var(--mono);font-weight:600}
.ac-out.bad{color:var(--bad)}
.ac-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ac-sp{flex:1}
.ac-danger{color:var(--bad)!important}
.ac-res{display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--ink);padding-top:14px}
.ac-res h3{margin:14px 0 4px}
.ac-kpis{display:flex;flex-wrap:wrap;gap:10px 28px;font:500 12px var(--mono);color:var(--muted)}
.ac-kpis b{display:block;font:700 22px var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.ac-tw{overflow-x:auto;max-width:100%}
.ac-t{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.ac-t th{text-align:left;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--ink);white-space:nowrap}
.ac-t td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ac-t td.ac-con{white-space:normal;min-width:220px}
.ac-t tfoot td{font-weight:700;border-top:1px solid var(--ink);border-bottom:0}
.es{display:flex;flex-direction:column;gap:16px}
.es-av{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.es-av li{padding:8px 12px;border-radius:6px;font-size:14px;border-left:3px solid}
.es-av .ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.es-av .warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.es-av .bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.es-svg{width:100%;min-width:480px;height:auto;display:block}
.es-step{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.es-floor{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.es-dim line{stroke:var(--accent-ink);stroke-width:1}
.es-dim text,.es-lbl{fill:var(--muted);font:500 11px var(--mono)}
.es-cols{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.es-cols .ac-t td{white-space:normal}
.es-cols h3{margin-top:0}
.es-trazo{max-height:360px;overflow-y:auto}
.mt{display:flex;flex-direction:column;gap:14px}
.mt-receta{border:1px solid var(--accent);border-radius:8px;padding:12px 16px;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.mt-receta h4{margin:0 0 6px;font:700 15px var(--display)}
.mt-receta ul{margin:0;padding-left:18px;font:500 15px var(--mono)}
.mt-notas{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;max-width:72ch}
@media (max-width:520px){.ac-f.w2{grid-column:1/-1}.ac-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{.ac-addel,.ac-add,.ac-crit,.ac-x,.ac-parr button[aria-pressed="false"]{display:none!important}.ac-el{break-inside:avoid}}

@media (max-width:820px){
  main .wrap{grid-template-columns:minmax(0,1fr)}
  body.viewing .list{display:none}
  body:not(.viewing) .detail.tool{display:none}
  .back{display:block}
  .upd{grid-template-columns:1fr;gap:4px}
}
@media print{
  header.top,.list,.actions,.back,footer,body::before{display:none!important}
  body{background:#fff;color:#000}
  main .wrap{display:block}
  .detail{border:0;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Obra<b>Lab</b></h1><small id="stamp">cargando…</small></div>
    <button class="theme" id="theme" type="button">Tema</button>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main>
  <div class="wrap" id="main"></div>
</main>
<footer><div class="wrap">ObraLab · mejora continua para control de obra · Ing. Miguel Estrada · Se actualiza diariamente.</div></footer>

<script src="modulos/acero.js"></script>
<script src="modulos/escalera.js"></script>
<script src="modulos/materiales.js"></script>
<script>
const TABS=[
  {id:"novedades",label:"Novedades"},
  {id:"calculadora",label:"Calculadoras"},
  {id:"formato",label:"Formatos"},
  {id:"calidad",label:"Checklists de calidad"},
  {id:"metodo",label:"Métodos"},
  {id:"recurso",label:"Herramientas digitales"}
];
const PREFIX={calculadora:"CAL",formato:"FMT",calidad:"QC",metodo:"MET",recurso:"DIG"};
let DATA=[],UPD=[],tab="novedades",sel=null,q="";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmtDate=d=>{const [y,m,da]=d.split("-");return `${da}/${["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][+m-1]}/${y}`};
const daysAgo=d=>(Date.now()-new Date(d+"T12:00:00").getTime())/864e5;

// tema
(function(){const t=store.get("theme");if(t)document.documentElement.dataset.theme=t;
  $("#theme").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    const n=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=n;store.set("theme",n)}})();

async function load(){
  const bust="?v="+Date.now();
  const [h,u]=await Promise.all([fetch("data/herramientas.json"+bust).then(r=>r.json()),fetch("data/actualizaciones.json"+bust).then(r=>r.json())]);
  DATA=h.herramientas; UPD=u.actualizaciones.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const counters={};DATA.forEach(t=>{counters[t.tipo]=(counters[t.tipo]||0)+1;t._code=(PREFIX[t.tipo]||"HER")+"-"+String(counters[t.tipo]).padStart(2,"0")});
  $("#stamp").textContent=`${DATA.length} herramientas · act. ${fmtDate(UPD[0]?.fecha||"2026-10-18")}`;
  const h0=location.hash.slice(1);
  if(h0&&DATA.find(t=>t.id===h0)){const t=DATA.find(t=>t.id===h0);tab=t.tipo;sel=t.id;document.body.classList.add("viewing")}
  else if(TABS.some(t=>t.id===h0))tab=h0;
  render();
}
function renderTabs(){
  $("#tabs").innerHTML=TABS.filter(t=>t.id==="novedades"||DATA.some(d=>d.tipo===t.id)).map(t=>{
    const n=t.id==="novedades"?UPD.length:DATA.filter(d=>d.tipo===t.id).length;
    return `<button role="tab" aria-selected="${t.id===tab}" data-tab="${t.id}">${t.label}<span class="n">${n}</span></button>`}).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;sel=null;q="";document.body.classList.remove("viewing");history.replaceState(null,"","#"+tab);render()});
}
function render(){
  renderTabs();
  if(tab==="novedades"){$("#main").innerHTML=renderFeed();bindChips();return}
  const items=DATA.filter(d=>d.tipo===tab);
  if(!sel||!items.find(i=>i.id===sel))sel=items[0]?.id;
  const ql=q.toLowerCase();
  const shown=items.filter(i=>!ql||(i.titulo+i.resumen+i.categoria).toLowerCase().includes(ql));
  const cur=DATA.find(d=>d.id===sel);
  $("#main").innerHTML=`<section class="list">
    <input class="search" id="q" type="search" placeholder="Buscar en ${esc(TABS.find(t=>t.id===tab).label.toLowerCase())}…" value="${esc(q)}">
    ${shown.map((i,k)=>`${tab==="calidad"&&(k===0||shown[k-1].categoria!==i.categoria)?`<p class="grp">${esc(i.categoria)}</p>`:""}<button class="item" data-id="${i.id}" aria-current="${i.id===sel}"><span class="code">${i._code}</span><strong>${esc(i.titulo)}${daysAgo(i.agregada)<7?'<span class="new">NUEVA</span>':""}</strong><span class="r">${esc(i.resumen)}</span></button>`).join("")||'<p class="empty">Sin resultados.</p>'}
  </section>
  <section class="detail tool" id="detail">${cur?renderTool(cur):""}</section>`;
  const qi=$("#q");qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll(".item").forEach(b=>b.onclick=()=>{sel=b.dataset.id;document.body.classList.add("viewing");history.replaceState(null,"","#"+sel);render();window.scrollTo({top:0})});
  const bk=$(".back");if(bk)bk.onclick=()=>{document.body.classList.remove("viewing");render()};
  if(cur)bindTool(cur);
}
function head(t){return `<button class="back" type="button">← ${esc(TABS.find(x=>x.id===t.tipo).label)}</button>
  <div class="eyebrow"><span>${t._code}</span><span>${esc(t.categoria)}</span><span>agregada ${fmtDate(t.agregada)}</span></div>
  <h2>${esc(t.titulo)}</h2><p class="lead">${esc(t.resumen)}</p>`}
const steps=a=>a?.length?`<h3>Cómo usarla en obra</h3><ol class="steps">${a.map(s=>`<li><span>${esc(s)}</span></li>`).join("")}</ol>`:"";
function renderTool(t){
  if(t.modulo){
    return head(t)+(t.beneficio?`<p class="benefit">${esc(t.beneficio)}</p>`:"")+`<div id="mod" class="mod"></div>`+steps(t.como_usar);
  }
  if(t.tipo==="calculadora"){
    const saved=store.get("calc:"+t.id)||{};
    return head(t)+`<div class="calc"><div>${t.entradas.map(e=>`<div class="field"><label for="in-${e.id}">${esc(e.label)}</label><div class="inp"><input id="in-${e.id}" data-k="${e.id}" type="number" inputmode="decimal" step="any" value="${saved[e.id]??e.valor}"><em>${esc(e.unidad)}</em></div></div>`).join("")}
      <button class="btn ghost" id="reset" type="button">Valores de ejemplo</button></div>
      <div><div class="outs" id="outs"></div></div></div>`+steps(t.como_usar);
  }
  if(t.tipo==="formato"||t.tipo==="calidad"){
    const s=store.get("fmt:"+t.id)||{campos:{},items:{}};
    return head(t)+`<h3>Datos generales</h3><div class="hdr">${t.campos.map((c,i)=>{const long=/actividades|incidencias|materiales|equipo/i.test(c);
      return `<div class="field"><label for="c-${i}">${esc(c)}</label>${long?`<textarea id="c-${i}" data-c="${esc(c)}">${esc(s.campos[c]||"")}</textarea>`:`<input id="c-${i}" data-c="${esc(c)}" value="${esc(s.campos[c]||"")}">`}</div>`}).join("")}</div>
      <h3>Verificación</h3>${t.items.map((it,i)=>{const v=s.items[i]||{};return `<div class="chk" data-i="${i}"><span class="t">${esc(it)}</span>
        <span class="seg">${[["si","Cumple"],["no","No"],["na","N/A"]].map(([k,l])=>`<button type="button" class="${k}" data-v="${k}" aria-pressed="${v.r===k}">${l}</button>`).join("")}</span>
        <input class="obs" id="o-${i}" placeholder="Observación / responsable / fecha" value="${esc(v.o||"")}"></div>`}).join("")}
      <p class="tally" id="tally"></p>
      <div class="actions"><button class="btn" id="csv" type="button">Exportar CSV</button><button class="btn ghost" id="print" type="button">Imprimir / PDF</button><button class="btn ghost" id="clear" type="button">Nuevo (limpiar)</button></div>`+steps(t.como_usar);
  }
  // metodo / recurso
  return head(t)+(t.beneficio?`<p class="benefit"><b>Beneficio:</b> ${esc(t.beneficio)}</p>`:"")+
    (t.tipo==="recurso"?`<div class="kpis">${t.plataforma?`<span>Plataforma<b>${esc(t.plataforma)}</b></span>`:""}${t.costo?`<span>Costo<b>${esc(t.costo)}</b></span>`:""}</div>${t.url?`<p><a href="${esc(t.url)}" target="_blank" rel="noopener">Abrir sitio oficial ↗</a></p>`:""}`:"")+
    steps(t.como_usar)+(t.fuentes?.length?`<p class="src">Fuentes: ${t.fuentes.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.titulo)}</a>`).join(" · ")}</p>`:"");
}
function num(v,d){return Number.isFinite(v)?v.toLocaleString("es-MX",{minimumFractionDigits:d,maximumFractionDigits:d}):"—"}
function bindTool(t){
  if(t.modulo){const m=window.ObraModulos&&window.ObraModulos[t.modulo];
    if(m)m($("#mod"));else $("#mod").innerHTML='<p class="empty">No se pudo cargar esta herramienta. Recarga la página.</p>';return}
  if(t.tipo==="calculadora"){
    const ids=t.entradas.map(e=>e.id);
    const fns=t.salidas.map(s=>{try{return new Function(...ids,"return ("+s.formula+")")}catch(e){return()=>NaN}});
    const calc=()=>{const vals=ids.map(k=>parseFloat($("#in-"+k).value));const sv={};ids.forEach((k,i)=>sv[k]=vals[i]);store.set("calc:"+t.id,sv);
      $("#outs").innerHTML=t.salidas.map((s,i)=>{let v;try{v=fns[i](...vals)}catch(e){v=NaN}
        let dot="";if(s.semaforo&&Number.isFinite(v)){const c=v>=s.semaforo[0]?"var(--ok)":v>=s.semaforo[1]?"var(--warn)":"var(--bad)";dot=`<i class="dot" style="background:${c}"></i>`}
        const money=s.unidad==="$";
        return `<div class="out${s.destacar?" big":""}"><span>${esc(s.label)}</span><b>${dot}${money?(v<0?"-$":"$")+num(Math.abs(v),s.decimales??0):num(v,s.decimales??2)}${!money&&s.unidad?`<small>${esc(s.unidad)}</small>`:""}</b></div>`}).join("")};
    document.querySelectorAll("#detail input[data-k]").forEach(i=>i.oninput=calc);
    $("#reset").onclick=()=>{t.entradas.forEach(e=>$("#in-"+e.id).value=e.valor);calc()};
    calc();
  }
  if(t.tipo==="formato"||t.tipo==="calidad"){
    const key="fmt:"+t.id;
    const read=()=>{const s={campos:{},items:{}};document.querySelectorAll("#detail [data-c]").forEach(el=>s.campos[el.dataset.c]=el.value);
      document.querySelectorAll(".chk").forEach(r=>{const p=r.querySelector('[aria-pressed="true"]');s.items[r.dataset.i]={r:p?.dataset.v||"",o:r.querySelector(".obs").value}});return s};
    const tally=()=>{const s=read();const v=Object.values(s.items);const c=k=>v.filter(x=>x.r===k).length;
      $("#tally").textContent=`Cumple ${c("si")} · No cumple ${c("no")} · N/A ${c("na")} · Pendientes ${v.filter(x=>!x.r).length} de ${t.items.length}`;store.set(key,s)};
    document.querySelectorAll("#detail input,#detail textarea").forEach(el=>el.addEventListener("input",tally));
    document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{const was=b.getAttribute("aria-pressed")==="true";b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));if(!was)b.setAttribute("aria-pressed","true");tally()});
    $("#csv").onclick=()=>{const s=read();const rows=[["Formato",t.titulo]];Object.entries(s.campos).forEach(([k,v])=>rows.push([k,v]));rows.push([]);rows.push(["Concepto","Resultado","Observación"]);
      t.items.forEach((it,i)=>rows.push([it,{si:"Cumple",no:"No cumple",na:"N/A"}[s.items[i]?.r]||"Pendiente",s.items[i]?.o||""]));
      const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
      const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`${t.id}_${(s.campos["Fecha"]||new Date().toISOString().slice(0,10)).replace(/\//g,"-")}.csv`;a.click()};
    $("#print").onclick=()=>window.print();
    $("#clear").onclick=()=>{store.set(key,null);render()};
    tally();
  }
}
function renderFeed(){
  const byId=Object.fromEntries(DATA.map(d=>[d.id,d]));
  const week=DATA.filter(d=>daysAgo(d.agregada)<7).length;
  return `<section class="detail" style="grid-column:1/-1">
    <div class="eyebrow"><span>Bitácora de mejora continua</span></div>
    <h2>Lo nuevo en ObraLab</h2>
    <div class="kpis"><span>Herramientas<b>${DATA.length}</b></span><span>Nuevas esta semana<b>${week}</b></span><span>Actualizaciones<b>${UPD.length}</b></span></div>
    <div class="feed">${UPD.map(u=>`<article class="upd"><time datetime="${u.fecha}">${fmtDate(u.fecha)}</time><div>
      <h4>${esc(u.titulo)}</h4><p>${esc(u.resumen)}</p>
      ${u.como_aplicarlo?`<p class="apply"><b>Cómo aplicarlo:</b> ${esc(u.como_aplicarlo)}</p>`:""}
      <div class="chips">${(u.herramientas||[]).filter(id=>byId[id]).map(id=>`<button class="chip" data-go="${id}">${esc(byId[id].titulo)}</button>`).join("")}</div>
      ${u.fuentes?.length?`<p class="src">Fuentes: ${u.fuentes.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.titulo)}</a>`).join(" · ")}</p>`:""}
    </div></article>`).join("")}</div></section>`;
}
function bindChips(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const t=DATA.find(d=>d.id===b.dataset.go);tab=t.tipo;sel=t.id;document.body.classList.add("viewing");history.replaceState(null,"","#"+sel);render();window.scrollTo({top:0})})}
addEventListener("hashchange",()=>{const h=location.hash.slice(1),t=DATA.find(d=>d.id===h);
  if(t&&t.id!==sel){tab=t.tipo;sel=t.id;document.body.classList.add("viewing");render()}
  else if(TABS.some(x=>x.id===h)&&h!==tab){tab=h;sel=null;document.body.classList.remove("viewing");render()}});
load().catch(e=>{$("#main").innerHTML=`<p class="empty">No se pudieron cargar los datos (${esc(e.message)}). Abre la app desde GitHub Pages o un servidor local.</p>`});
</script>
</body>
</html>
